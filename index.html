<!DOCTYPE html>
<html>
<head>
    <style>
    /* Сброс стилей по умолчанию */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border: none;
    }

    /* Основной контейнер видео блока */
    .videoblock {
        /* Удалены фиксированные размеры и абсолютное позиционирование */
        position: relative; /* Заменено с absolute на relative */
        background-color: rgba(255,255,255,1);
        overflow: hidden;
        display: inline-block; /* Позволяет блоку подстраиваться под содержимое */
        padding: 10px; /* Добавлен отступ для эстетики */
    }

    /* Контейнер видео плеера */
    .video-container {
        position: relative; /* Заменено с absolute на relative для лучшего управления */
        overflow: visible;
        width: 314.552px;
        height: 176px;
        background-color: rgba(0,0,0,1);
        border: 1px solid rgba(49,49,49,1);
        border-radius: 1.5px;
        border-bottom-left-radius: 0px;
        border-bottom-right-radius: 0px;
        border-bottom: none;
        cursor: pointer;
    }

    .video-container #video{
        background-size: cover;
    }

    /* Информационная панель видео */
    .video-info {
        position: relative; /* Заменено с absolute на relative */
        overflow: visible;
        width: 314.552px;
        height: 31px;
        background-color: rgba(22,22,22,1);
        border: 1px solid rgba(49,49,49,1);
        border-bottom-right-radius: 1.5px;
        border-bottom-left-radius: 1.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -1px; /* Для наложения границы с видео контейнером */
    }

    /* Стили для отображения текущего времени */
    #currentTime {
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        padding: 5px;
    }

    /* Прогресс Бар с контейнером для области наведения */
    #progressBarContainer {
        position: relative; /* Заменено с absolute на relative */
        width: 298.945px;
        top: -41px;
        margin-left: 8px;
        height: 21px; /* 1px видимый бар + 10px сверху и снизу */
        cursor: pointer;
        pointer-events: auto;
    }

    /* Фон прогресс-бара */
    #progressBarBackground {
        position: relative; /* Заменено с absolute на relative */
        width: 100%;
        height: 1px;
        top: 10px; /* Центрируем 1px бар внутри контейнера высотой 21px */
        background-color: #8a8a8a; /* Цвет не проигранной части */
        transition: height 0.125s ease, top 0.125s ease; /* Сохранены переходы */
    }

    /* Заполнение прогресс-бара */
    #progressBarFill {
        width: 0%;
        height: 100%;
        background-color: #2d8ceb; /* Цвет проигранной части */
        transition: width 0.125s ease, height 0.125s ease, top 0.125s ease; /* Сохранены переходы */
    }

    /* Кнопка перемотки */
    #seekKnob {
        position: absolute;
        width: 8px;
        height: 8px;
        left: 0%; /* Начальная позиция */
        top: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(45,140,235,1);
        border-radius: 50%;
        cursor: pointer;
        transition: left 0.25s linear, width 0.125s ease, height 0.125s ease, border 0.125s ease, background-color 0.125s ease; /* Добавлен переход для left */
    }

    /* Псевдоэлемент для внутреннего круга при наведении */
    #seekKnob::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        background-color: #e7e7e7;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.125s ease;
    }

    /* Показать внутренний круг при наведении на seekKnob */
    #seekKnob:hover::before {
        opacity: 1;
    }

    /* Иконки управления воспроизведением */
    .control-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 16px; /* Размер иконок 16px */
        height: 16px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.125s ease;
        pointer-events: none; /* Чтобы иконки не блокировали клики */
    }

    /* Класс для отображения иконки */
    .visible {
        opacity: 1;
    }

    /* Изменение высоты прогресс-бара при наведении на контейнер */
    #progressBarContainer:hover #progressBarBackground,
    #progressBarContainer:hover #progressBarFill {
        height: 3px;
        top: 8px; /* Сдвигаем вверх, чтобы центрировать 3px бар */
    }

    /* Изменение стилей seekKnob при наведении на прогресс-бар */
    #progressBarContainer:hover #seekKnob {
        width: 14px;
        height: 14px;
        border: 1px solid #2d8ceb;
        background-color: #232323;
    }

    /* Класс для отключения переходов */
    .no-transition {
        transition: none !important;
    }
    </style>
</head>
<body>
    <div class="videoblock">
        <!-- Видео плеер -->
        <div class="video-container" id="videoContainer">
            <!-- Видео элемент -->
            <video id="video" width="100%" height="100%" src="video.webm" type="video/webm"></video>
            <!-- Иконка Play -->
            <img src="play.svg" id="playIcon" class="control-icon" alt="Play">
            <!-- Иконка Pause -->
            <img src="pause.svg" id="pauseIcon" class="control-icon" alt="Pause">
        </div>

        <!-- Информационная панель о видео -->
        <div class="video-info" id="videoInfo">
            <p id="currentTime">00:00:00</p>
        </div>

        <!-- Прогресс Бар с контейнером для области наведения -->
        <div id="progressBarContainer">
            <div id="progressBarBackground">
                <div id="progressBarFill"></div>
                <!-- Кнопка перемотки перемещена внутрь progressBarBackground -->
                <div id="seekKnob"></div>
            </div>
        </div>
    </div>

    <script>
    // Получаем элементы
    var video = document.getElementById('video');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var progressBarFill = document.getElementById('progressBarFill');
    var progressBarBackground = document.getElementById('progressBarBackground');
    var seekKnob = document.getElementById('seekKnob');
    var videoContainer = document.getElementById('videoContainer');
    var progressBarContainer = document.getElementById('progressBarContainer');
    var currentTimeElement = document.getElementById('currentTime'); // Новый элемент для времени

    // Флаг перетаскивания ползунка
    var isDragging = false;

    // Переменная для анимации
    var animationFrameId;

    // Функция для обновления иконок при изменении состояния видео
    function updateIconsOnStateChange() {
        if (video.paused) {
            // Когда видео на паузе, показываем иконку Play
            playIcon.classList.add('visible');
            pauseIcon.classList.remove('visible');
        } else {
            // Когда видео играет, показываем иконку Pause
            pauseIcon.classList.add('visible');
            playIcon.classList.remove('visible');
        }
    }

    // Функция для отображения соответствующей иконки при наведении
    function showHoverIcon() {
        if (video.paused) {
            // Если видео на паузе, показываем иконку Play
            playIcon.classList.add('visible');
        } else {
            // Если видео играет, показываем иконку Pause
            pauseIcon.classList.add('visible');
        }
    }

    // Функция для скрытия иконок при уходе курсора
    function hideHoverIcons() {
        playIcon.classList.remove('visible');
        pauseIcon.classList.remove('visible');
    }

    // Функция для кратковременного отображения иконки при изменении состояния
    function flashIcon(icon) {
        icon.classList.add('visible');
        setTimeout(function() {
            icon.classList.remove('visible');
        }, 125); // 0.125 секунд
    }

    // Функция для форматирования времени в чч:мм:сс
    function formatTime(seconds) {
        var hrs = Math.floor(seconds / 3600);
        var mins = Math.floor((seconds % 3600) / 60);
        var secs = Math.floor(seconds % 60);
        return [
            hrs.toString().padStart(2, '0'),
            mins.toString().padStart(2, '0'),
            secs.toString().padStart(2, '0')
        ].join(':');
    }

    // Функция для обновления прогресса и текущего времени
    function updateProgress() {
        if (!isDragging) { // Обновляем только если не происходит перетаскивание
            var progress = (video.currentTime / video.duration) * 100;
            progressBarFill.style.width = progress + '%';
            // Обновляем позицию кнопки перемотки
            var progressBarRect = progressBarBackground.getBoundingClientRect();
            var knobPosition = (progress / 100) * progressBarRect.width;
            // Позиционируем knob относительно progressBarBackground
            seekKnob.style.left = knobPosition + 'px';
            // Обновляем текущее время
            currentTimeElement.textContent = formatTime(video.currentTime);
        }
        // Запрашиваем следующий кадр
        animationFrameId = requestAnimationFrame(updateProgress);
    }

    // Начальная иконка (показываем Play, если видео на паузе)
    window.addEventListener('load', function() {
        updateIconsOnStateChange();
        currentTimeElement.textContent = formatTime(0);
        // Запускаем анимацию прогресса
        animationFrameId = requestAnimationFrame(updateProgress);
    });

    // Обработчик клика на видео плеер
    videoContainer.addEventListener('click', function() {
        if (video.paused) {
            video.play();
            // Показываем иконку Pause на короткое время
            flashIcon(pauseIcon);
        } else {
            video.pause();
            // Показываем иконку Play на короткое время
            flashIcon(playIcon);
        }
        // Обновляем иконки при клике
        updateIconsOnStateChange();
    });

    // Обновляем иконки при изменении состояния видео
    video.addEventListener('play', function() {
        updateIconsOnStateChange();
    });

    video.addEventListener('pause', function() {
        updateIconsOnStateChange();
    });

    // Обработка перетаскивания кнопки перемотки
    function updateSeekKnob(clientX) {
        var progressBarRect = progressBarBackground.getBoundingClientRect();
        var clampedX = Math.max(0, Math.min(clientX - progressBarRect.left, progressBarRect.width));
        var progress = (clampedX / progressBarRect.width) * 100;
        progressBarFill.style.width = progress + '%';
        seekKnob.style.left = clampedX + 'px';
        video.currentTime = (clampedX / progressBarRect.width) * video.duration;
        // Обновляем текущее время при перемотке
        currentTimeElement.textContent = formatTime(video.currentTime);
    }

    seekKnob.addEventListener('mousedown', function(event) {
        isDragging = true;
        // Отключаем переходы для мгновенного обновления
        progressBarBackground.classList.add('no-transition');
        progressBarFill.classList.add('no-transition');
        seekKnob.classList.add('no-transition');
        // При начале перетаскивания останавливаем анимацию прогресса
        cancelAnimationFrame(animationFrameId);
        event.preventDefault();
    });

    document.addEventListener('mousemove', function(event) {
        if (isDragging) {
            updateSeekKnob(event.clientX);
        }
    });

    document.addEventListener('mouseup', function(event) {
        if (isDragging) {
            isDragging = false;
            // Восстанавливаем переходы
            progressBarBackground.classList.remove('no-transition');
            progressBarFill.classList.remove('no-transition');
            seekKnob.classList.remove('no-transition');
            // Возобновляем анимацию прогресса
            animationFrameId = requestAnimationFrame(updateProgress);
        }
    });

    // Позволяем кликать по прогресс бару для перемотки
    progressBarContainer.addEventListener('click', function(event) {
        var progressBarRect = progressBarBackground.getBoundingClientRect();
        var clampedX = Math.max(0, Math.min(event.clientX - progressBarRect.left, progressBarRect.width));
        var progress = (clampedX / progressBarRect.width) * 100;
        progressBarFill.style.width = progress + '%';
        seekKnob.style.left = clampedX + 'px';
        video.currentTime = (clampedX / progressBarRect.width) * video.duration;
        // Обновляем текущее время при клике
        currentTimeElement.textContent = formatTime(video.currentTime);
    });

    // Обработчики наведения на видео плеер
    videoContainer.addEventListener('mouseenter', function() {
        showHoverIcon();
    });

    videoContainer.addEventListener('mouseleave', function() {
        hideHoverIcons();
    });

    // Обработчик изменения размера окна для корректировки позиции ползунка
    window.addEventListener('resize', function() {
        if (!isDragging) {
            var progress = (video.currentTime / video.duration) * 100;
            var progressBarRect = progressBarBackground.getBoundingClientRect();
            var knobPosition = (progress / 100) * progressBarRect.width;
            seekKnob.style.left = knobPosition + 'px';
        }
    });
    </script>
</body>
</html>
