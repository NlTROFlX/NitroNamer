<!DOCTYPE html>
<html>
<head>
    <style>
    /* Сброс стилей по умолчанию */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border: none;
    }

    /* Основной контейнер */
    #artboard {
        position: absolute;
        width: 1920px;
        height: 1080px;
        background-color: rgba(255,255,255,1);
        overflow: hidden;
    }

    /* Контейнер видео плеера */
    .video-container {
        position: absolute;
        overflow: visible;
        width: 314.552px;
        height: 176px;
        left: 803.011px;
        top: 437.064px;
        background-color: rgba(0,0,0,1);
        border: 1px solid rgba(49,49,49,1);
        border-radius: 1.5px;
        cursor: pointer;
    }

    /* Информационная панель видео */
    .video-info {
        position: absolute;
        overflow: visible;
        width: 314.552px;
        height: 31px;
        left: 803.011px;
        top: 612px;
        background-color: rgba(22,22,22,1);
        border: 1px solid rgba(49,49,49,1);
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom-right-radius: 1.5px;
        border-bottom-left-radius: 1.5px;
    }

    /* Прогресс Бар с контейнером для области наведения */
    #progressBarContainer {
        position: absolute;
        width: 298.945px;
        height: 21px; /* 1px видимый бар + 10px сверху и снизу */
        left: 811.055px;
        top: 601.5px; /* 611.5px (оригинальный top) - 10px */
        cursor: pointer;
        /* Убедитесь, что контейнер не влияет на расположение остальных элементов */
        pointer-events: auto;
    }

    /* Фон прогресс-бара */
    #progressBarBackground {
        position: absolute;
        width: 100%;
        height: 1px;
        top: 10px; /* Центрируем 1px бар внутри контейнера высотой 21px */
        background-color: #8a8a8a; /* Цвет не проигранной части */
        transition: height 0.125s ease, top 0.125s ease; /* Сохранены переходы */
    }

    /* Заполнение прогресс-бара */
    #progressBarFill {
        width: 0%;
        height: 100%;
        background-color: #2d8ceb; /* Цвет проигранной части */
        transition: width 0.125s ease, height 0.125s ease, top 0.125s ease; /* Сохранены переходы */
    }

    /* Кнопка перемотки */
    #seekKnob {
        position: absolute;
        width: 8px;
        height: 8px;
        left: 0%; /* Начальная позиция */
        top: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(45,140,235,1);
        border-radius: 50%;
        cursor: pointer;
        transition: width 0.125s ease, height 0.125s ease, border 0.125s ease, background-color 0.125s ease; /* Сохранены переходы */
    }

    /* Псевдоэлемент для внутреннего круга при наведении */
    #seekKnob::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        background-color: #e7e7e7;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.125s ease;
    }

    /* Показать внутренний круг при наведении на seekKnob */
    #seekKnob:hover::before {
        opacity: 1;
    }

    /* Иконки управления воспроизведением */
    .control-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px; /* Настройте размер иконок по необходимости */
        height: 50px;
        cursor: pointer;
        display: none;
    }

    #playIcon {
        display: block; /* Изначально показываем иконку play */
    }

    /* Изменение высоты прогресс-бара при наведении на контейнер */
    #progressBarContainer:hover #progressBarBackground,
    #progressBarContainer:hover #progressBarFill {
        height: 3px;
        top: 8px; /* Сдвигаем вверх, чтобы центрировать 3px бар */
    }

    /* Изменение стилей seekKnob при наведении на прогресс-бар */
    #progressBarContainer:hover #seekKnob {
        width: 14px;
        height: 14px;
        border: 1px solid #2d8ceb;
        background-color: #232323;
    }

    /* Класс для отключения переходов */
    .no-transition {
        transition: none !important;
    }
    </style>
</head>
<body>
    <div id="artboard">
        <!-- Видео плеер -->
        <div class="video-container" id="videoContainer">
            <!-- Видео элемент -->
            <video id="video" width="100%" height="100%" src="video.webm" type="video/webm"></video>
            <!-- Иконка Play -->
            <img src="play.svg" id="playIcon" class="control-icon" alt="Play">
            <!-- Иконка Pause -->
            <img src="pause.svg" id="pauseIcon" class="control-icon" alt="Pause">
        </div>

        <!-- Информационная панель о видео -->
        <div class="video-info" id="videoInfo">
            <p style="color: white; padding: 5px;">Информация о видео здесь</p>
        </div>

        <!-- Прогресс Бар с контейнером для области наведения -->
        <div id="progressBarContainer">
            <div id="progressBarBackground">
                <div id="progressBarFill"></div>
                <!-- Кнопка перемотки перемещена внутрь progressBarBackground -->
                <div id="seekKnob"></div>
            </div>
        </div>
    </div>

    <script>
    // Получаем элементы
    var video = document.getElementById('video');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var progressBarFill = document.getElementById('progressBarFill');
    var progressBarBackground = document.getElementById('progressBarBackground');
    var seekKnob = document.getElementById('seekKnob');
    var videoContainer = document.getElementById('videoContainer');
    var progressBarContainer = document.getElementById('progressBarContainer');

    // Функция для обновления иконок
    function updateIcons() {
        if (video.paused) {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        } else {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'none'; // Иконка паузы не отображается, когда видео играет
        }
    }

    // Начальная иконка
    updateIcons();

    // Обработчик клика на видео плеер
    videoContainer.addEventListener('click', function() {
        if (video.paused) {
            video.play();
            // Коротко показываем иконку Play
            playIcon.style.display = 'block';
            setTimeout(function() {
                playIcon.style.display = 'none';
            }, 125); // 0.125 секунд
        } else {
            video.pause();
            // Показываем иконку Pause
            pauseIcon.style.display = 'block';
        }
    });

    // Обновляем иконки при изменении состояния видео
    video.addEventListener('play', function() {
        updateIcons();
    });

    video.addEventListener('pause', function() {
        updateIcons();
    });

    // Обновляем прогресс бар по мере воспроизведения видео
    video.addEventListener('timeupdate', function() {
        if (!isDragging) { // Обновляем только если не происходит перетаскивание
            var progress = (video.currentTime / video.duration) * 100;
            progressBarFill.style.width = progress + '%';
            // Обновляем позицию кнопки перемотки
            var progressBarRect = progressBarBackground.getBoundingClientRect();
            var knobPosition = (progress / 100) * progressBarRect.width;
            // Позиционируем knob относительно progressBarBackground
            seekKnob.style.left = knobPosition + 'px';
        }
    });

    // Обработка перетаскивания кнопки перемотки
    var isDragging = false;

    // Функция для обновления позиции ползунка
    function updateSeekKnob(clientX) {
        var progressBarRect = progressBarBackground.getBoundingClientRect();
        var clampedX = Math.max(0, Math.min(clientX - progressBarRect.left, progressBarRect.width));
        var progress = (clampedX / progressBarRect.width) * 100;
        progressBarFill.style.width = progress + '%';
        seekKnob.style.left = clampedX + 'px';
        video.currentTime = (clampedX / progressBarRect.width) * video.duration;
    }

    seekKnob.addEventListener('mousedown', function(event) {
        isDragging = true;
        // Отключаем переходы для мгновенного обновления
        progressBarBackground.classList.add('no-transition');
        progressBarFill.classList.add('no-transition');
        seekKnob.classList.add('no-transition');
        event.preventDefault();
    });

    document.addEventListener('mousemove', function(event) {
        if (isDragging) {
            updateSeekKnob(event.clientX);
        }
    });

    document.addEventListener('mouseup', function(event) {
        if (isDragging) {
            isDragging = false;
            // Восстанавливаем переходы
            progressBarBackground.classList.remove('no-transition');
            progressBarFill.classList.remove('no-transition');
            seekKnob.classList.remove('no-transition');
        }
    });

    // Позволяем кликать по прогресс бару для перемотки
    progressBarContainer.addEventListener('click', function(event) {
        var progressBarRect = progressBarBackground.getBoundingClientRect();
        var clampedX = Math.max(0, Math.min(event.clientX - progressBarRect.left, progressBarRect.width));
        var progress = (clampedX / progressBarRect.width) * 100;
        progressBarFill.style.width = progress + '%';
        seekKnob.style.left = clampedX + 'px';
        video.currentTime = (clampedX / progressBarRect.width) * video.duration;
    });
    </script>
</body>
</html>
