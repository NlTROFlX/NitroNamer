<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Panel</title>
    <script src="CSInterface.js"></script>
    <script src="index.js"></script>
    <style>
        /* Подключение шрифта FiraSans */
        @font-face {
            font-family: 'Fira Sans';
            src: url('FiraSans-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Установка глобального цвета фона и базовых стилей */
        body, html {
            margin: 0;
            padding: 0;
            width: 468px;
            height: 468px;
            overflow: hidden;
            background-color: #232323;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Fira Sans', sans-serif;
            color: #ffffff;
            user-select: none; /* Запрет на выделение текста */
        }

        /* Верхний блок */
        .top-bar {
            width: 468px;
            height: 40px;
            background-color: #161616;
            border-bottom: 1px solid #313131;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-right: 8px;
            padding-left: 8px;
            color: #b9b9b9;
            position: relative;
        }

        .title-thin-italic {
            font-family: 'Fira Sans';
            font-weight: 100;
            font-style: italic;
            font-size: 24px;
            margin: 0;
        }

        .title-semibold-italic {
            font-family: 'Fira Sans';
            font-weight: 600;
            font-style: italic;
            font-size: 24px;
            margin: 0;
        }

        /* Линия, соединяющая top-bar и кружок */
        .indicator-line {
            position: absolute;
            top: 40px; /* Находится сразу под top-bar */
            left: -1px;
            width: 1px;
            background-color: #2d8ceb;
            transition: height 0.125s ease, left 0.125s ease;
            z-index: 999;
        }

        /* Контейнер для двух колонок */
        .split-container {
            display: flex;
            width: 100%;
            height: calc(100% - 80px); /* Учитывая верхний и нижний блок */
            position: relative;
        }

        /* Левая и правая половины */
        .left {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid #313131;
        }

        .right {
            width: 50%;
            height: 100%;
            padding: 0;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .left, .right{
            background-color: #1d1d1d;
        }

        /* Стиль активного спойлера */
        .spoiler.active {
            background-color: #2a2a2a;
            padding: 8px;
            padding-bottom: 8px;
            transition: background-color 0.125s ease; /* Плавная анимация для фона */
            position: relative;
        }

        .spoiler.active .spoiler-title {
            color: #2d8ceb;
            font-family: 'Fira Sans', sans-serif;
            font-size: 14px;
            font-weight: normal;
            transition: color 0.125s ease; /* Плавная анимация для цвета текста */
        }

        .spoiler.active .spoiler-icon {
            filter: invert(48%) sepia(82%) saturate(2053%) hue-rotate(177deg) brightness(95%) contrast(102%);
            transition: filter 0.125s ease; /* Плавная анимация для фильтра */
        }

        .spoiler.active .spoiler-content {
            display: block;
            font-family: 'Fira Sans', sans-serif;
            font-size: 12px;
            color: #b9b9b9;
            margin-top: 8px; /* Отступ сверху от заголовка до подпунктов */
            transition: opacity 0.125s ease; /* Плавное появление контента */
        }

        .spoiler.active .spoiler-content p {
            margin-top: 4px; /* Отступ сверху между подпунктами */
            margin-left: 24px; /* Отступ слева */
            cursor: pointer;
            transition: color 0.124s ease; /* Плавная анимация для цвета текста */
        }

        .spoiler.active .spoiler-content p.selected {
            color: #b9b9b9; /* Цвет выделенного подпункта */
        }

        .spoiler.active .spoiler-content p:hover {
            color: #b9b9b9; /* Цвет при наведении на подпункт */
            transition: color 0.124s ease; /* Плавная анимация при наведении */
        }

        /* Синий кружок с числом подпунктов */
        .active-indicator {
            width: 16px;
            height: 16px;
            border: 1px solid #2d8ceb;
            background-color: #232323;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            transition: top 0.125s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Sans', sans-serif;
            font-weight: normal;
            font-size: 12px;
            color: #2d8ceb;
        }

        /* Стиль неактивного спойлера */
        .spoiler.inactive {
            background-color: #1d1d1d;
            padding: 8px;
            transition: background-color 0.125s ease; /* Плавная анимация для фона */
        }

        .spoiler.inactive .spoiler-title {
            color: #8a8a8a;
            font-family: 'Fira Sans', sans-serif;
            font-size: 14px;
            font-weight: normal;
            transition: color 0.125s ease; /* Плавная анимация для цвета текста */
        }

        .spoiler.inactive .spoiler-icon {
            filter: invert(20%) sepia(0%) saturate(0%) hue-rotate(0deg) brightness(80%) contrast(100%);
            transition: filter 0.125s ease; /* Плавная анимация для фильтра */
        }

        .spoiler .spoiler-content p {
            color: #8a8a8a;
            margin-bottom: 0px;
        }

        .spoiler.inactive .spoiler-content {
            display: none;
            opacity: 0;
        }

        /* Контейнер для иконки и заголовка */
        .spoiler-title-container {
            display: flex;
            align-items: center;
        }

        /* Новый контейнер для иконки с фиксированной высотой */
        .spoiler-icon-container {
            width: 8.9715px;
            height: 8.9715px; /* Фиксированная высота */
            padding-right: 4px;
            display: flex;
            align-items: center;
            justify-content: center; /* Центрируем иконку */
        }

        .spoiler-icon {
            width: auto;
            height: 8.9715px; /* Иконка с фиксированной высотой */
        }

        /* Эффект при наведении на спойлер */
        .spoiler:hover {
            background-color: #2a2a2a; /* При наведении меняется фоновый цвет */
            transition: background-color 0.125s ease; /* Плавная анимация для фона */
        }

        /* Нижний блок внутри правой половины */
        .bottom-bar {
            width: 234px;
            height: 40px;
            background-color: #161616;
            border-top: 1px solid #313131;
            box-sizing: border-box;
            margin-top: auto; /* Прижать к низу блока .right */
            align-self: flex-start;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Sans', sans-serif;
            font-size: 12px;
            color: #b9b9b9;
        }

        .license-by {
            font-weight: normal;
        }

        .license-nitrofix {
            font-weight: 100;
            font-style: italic;
        }

        .icon {
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Верхний блок -->
    <div class="top-bar">
        <span class="title-thin-italic">NitroNamer</span>
        <span class="title-semibold-italic"> Variable Library</span>
        <span class="title-thin-italic"> 2024.4</span>
    </div>

    <!-- Линия, соединяющая top-bar и кружок -->
    <div id="indicator-line" class="indicator-line"></div>

    <!-- Контейнер для двух колонок -->
    <div class="split-container">
        <!-- Левая колонка со спойлерами -->
        <div class="left">
            <div class="spoiler active" onclick="toggleSpoiler(this)">
                <div class="spoiler-title-container">
                    <div class="spoiler-icon-container">
                        <img src="icons/icon1.svg" class="spoiler-icon" alt="Icon 1">
                    </div>
                    <div class="spoiler-title">Composition information</div>
                </div>
                <div class="spoiler-content">
                    <p onclick="selectSubItem(this); showContent('Current composition name')">[1] C - Current composition name.</p>
                    <p onclick="selectSubItem(this); showContent('Current project name')">[1] Pn - Current project name.</p>
                </div>
            </div>

            <div class="spoiler inactive" onclick="toggleSpoiler(this)">
                <div class="spoiler-title-container">
                    <div class="spoiler-icon-container">
                        <img src="icons/icon2.svg" class="spoiler-icon" alt="Icon 2">
                    </div>
                    <div class="spoiler-title">Time and duration</div>
                </div>
                <div class="spoiler-content">
                    <p onclick="selectSubItem(this); showContent('Time properties information')">Time properties information...</p>
                </div>
            </div>
        </div>

        <!-- Правая колонка с информацией -->
        <div class="right" id="info-display">
            <p>Select an item from the left to see details here.</p>
            <!-- Нижний блок внутри правой половины -->
            <div class="bottom-bar">
                <span class="license-by" id="license-by">LICENSE BY</span>
                <span class="license-nitrofix" id="license-nitrofix">NITROFIX</span>
                <img src="icons/icon_boosty.svg" class="icon" id="boosty-icon" height="14px" alt="Boosty">
                <img src="icons/icon_github.svg" class="icon" width="13.7667px" alt="GitHub">
                <img src="icons/icon_reddit.svg" class="icon" height="14px" alt="Reddit">
                <img src="icons/icon_telegram.svg" class="icon" height="14px" alt="Telegram">
            </div>        
        </div>

        <!-- Синий кружок с числом подпунктов -->
        <div id="active-indicator" class="active-indicator">2</div>
    </div>

    <script>
        // Функция для переключения спойлеров
        function toggleSpoiler(spoiler) {
            if (spoiler.classList.contains('inactive')) {
                var allSpoilers = document.querySelectorAll('.spoiler');
                allSpoilers.forEach(function (s) {
                    if (s !== spoiler) {
                        s.classList.remove('active');
                        s.classList.add('inactive');
                    }
                });

                spoiler.classList.remove('inactive');
                spoiler.classList.add('active');
                updateActiveIndicator(spoiler);
            } else {
                updateActiveIndicator(spoiler);
            }
        }

        // Функция для выбора подпункта
        function selectSubItem(subItem) {
            var allSubItems = document.querySelectorAll('.spoiler-content p');
            allSubItems.forEach(function (item) {
                item.classList.remove('selected');
            });
            subItem.classList.add('selected');
        }

        // Функция для отображения информации в правом блоке
        function showContent(content) {
            var infoDisplay = document.getElementById('info-display');

            // Убедимся, что нижний блок остается
            var existingBottomBar = infoDisplay.querySelector('.bottom-bar');
            if (!existingBottomBar) {
                // Если `.bottom-bar` ещё нет, добавим её один раз
                var bottomBar = document.createElement('div');
                bottomBar.className = 'bottom-bar';
                infoDisplay.appendChild(bottomBar);
            }

            // Обновим текстовую информацию, не трогая `.bottom-bar`
            var contentElement = infoDisplay.querySelector('.content-display');
            if (!contentElement) {
                contentElement = document.createElement('p');
                contentElement.className = 'content-display';
                infoDisplay.insertBefore(contentElement, existingBottomBar || bottomBar);
            }

            contentElement.innerHTML = content;
        }

        // Функция для обновления положения синего кружка и числа подпунктов
        function updateActiveIndicator(activeSpoiler) {
            var indicator = document.getElementById('active-indicator');
            var indicatorLine = document.getElementById('indicator-line');
            var spoilerTitle = activeSpoiler.querySelector('.spoiler-title-container');
            var subItems = activeSpoiler.querySelectorAll('.spoiler-content p');
            if (spoilerTitle) {
                var offsetTop = activeSpoiler.offsetTop + spoilerTitle.offsetTop + (spoilerTitle.offsetHeight / 2) - (indicator.offsetHeight / 2);
                var indicatorLeft = indicator.getBoundingClientRect().left - indicator.parentElement.getBoundingClientRect().left;
                indicator.style.top = offsetTop + 'px';
                indicatorLine.style.height = offsetTop + 'px';
                indicatorLine.style.left = indicatorLeft + (indicator.offsetWidth / 2) + 'px';
                indicator.textContent = subItems.length; // Обновляем число подпунктов в кружке
            }
        }

        // Устанавливаем начальное положение для активного кружка и линии
        document.addEventListener("DOMContentLoaded", function() {
            var activeSpoiler = document.querySelector('.spoiler.active');
            if (activeSpoiler) {
                updateActiveIndicator(activeSpoiler);
            }
        });
    </script>
</body>
</html>
